<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesa Marketing Career GPS</title>
<style>
  :root{
    --ink:#14211E; --paper:#F4F6F4; --card:#FFFFFF; --hair:#E0E5E1;
    --teal:#0E5A4F; --teal2:#137A66; --slate:#5B6B78; --slate-d:#3F4C57;
    --coral:#DA5247; --coral-d:#B73B31; --muted:#6E7B76; --faint:#AEB8B3;
    --shared:#0E7D68; --ic:#5B6B78; --people:#DA5247;
    --shadow:0 1px 2px rgba(20,33,30,.05),0 8px 24px rgba(20,33,30,.06);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .app{display:flex;min-height:100vh}

  /* ---------- sidebar ---------- */
  .side{width:264px;flex:0 0 264px;background:var(--ink);color:#EAF0EC;
    padding:26px 18px 32px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100dvh;overflow-y:auto}
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
  .brand .logo{font-weight:800;letter-spacing:-.04em;font-size:26px;color:#fff}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);
    display:inline-block;margin-bottom:3px}
  .brand-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;
    text-transform:uppercase;color:#8FA29B;margin:0 0 26px 2px}
  .nav-h{font-family:var(--mono);font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:#7E918A;margin:18px 6px 8px}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:0;color:#CBD6D0;font-family:var(--sans);font-size:14px;
    padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s;line-height:1.25}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.active{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
  .nav .tick{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
  .nav .home{font-weight:600;color:#fff}
  .side-foot{margin-top:26px;padding-top:16px;border-top:1px solid #2A3733;
    font-size:11.5px;color:#7E918A;line-height:1.5}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;padding:30px 40px 80px;max-width:1180px}
  .topline{font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  h1.dept{font-size:30px;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
  .blurb{color:var(--muted);font-size:15px;max-width:780px;margin:0 0 22px}

  .legend{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 14px;font-size:12.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:22px;height:4px;border-radius:3px;display:inline-block}

  .mapwrap{background:var(--card);border:1px solid var(--hair);border-radius:16px;
    box-shadow:var(--shadow);padding:10px;margin-bottom:26px;overflow-x:auto}
  .mapinner{min-width:760px}
  svg .node{cursor:pointer}
  svg .node circle{transition:transform .15s, filter .15s}
  svg .node:hover circle{filter:brightness(1.06)}
  svg .label{font-family:var(--sans);font-size:13px;font-weight:600;fill:var(--ink)}
  svg .code{font-family:var(--mono);font-size:10px;fill:#fff;opacity:.85;font-weight:700;letter-spacing:.05em}
  svg .tracklab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;font-weight:700}
  svg .ring{fill:none;stroke-width:3}
  svg .beyondlab{font-family:var(--sans);font-size:11.5px;fill:var(--faint);font-weight:600}

  /* ---------- detail ---------- */
  .detail{background:var(--card);border:1px solid var(--hair);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden}
  .d-head{padding:22px 26px 18px;border-bottom:1px solid var(--hair)}
  .d-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .chip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
    padding:3px 9px;border-radius:999px;border:1px solid var(--hair);color:var(--muted)}
  .chip.band{color:#fff;border:0}
  .chip.track{border:0;color:#fff}
  .d-title{font-size:23px;font-weight:800;letter-spacing:-.01em;margin:0}
  .d-body{padding:8px 26px 24px}
  .sec{padding:18px 0;border-bottom:1px solid var(--hair)}
  .sec:last-child{border-bottom:0}
  .sec h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--teal);margin:0 0 10px;font-weight:700}
  .sec p{margin:0;font-size:15px;color:#27332F}
  .own{margin:0;padding:0;list-style:none}
  .own li{position:relative;padding-left:20px;margin-bottom:7px;font-size:14.5px;color:#27332F}
  .own li:before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;
    border-radius:2px;background:var(--teal2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .skchip{font-size:12.5px;background:#EEF4F1;color:#235047;border:1px solid #DCE8E3;
    padding:5px 11px;border-radius:999px;font-weight:600}
  .acc{border:1px solid var(--hair);border-radius:10px;overflow:hidden}
  .acc + .acc{margin-top:8px}
  .acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:#fff;border:0;padding:13px 15px;text-align:left;cursor:pointer;font-family:var(--sans);
    font-size:14.5px;font-weight:600;color:var(--ink)}
  .acc>button:hover{background:#F7FAF8}
  .acc .arw{flex:0 0 auto;color:var(--muted);transition:transform .18s;font-size:13px}
  .acc.open .arw{transform:rotate(90deg)}
  .acc .panel{max-height:0;overflow:hidden;transition:max-height .22s ease}
  .acc.open .panel{max-height:900px}
  .acc .ctx{margin:0 15px 10px;padding:10px 12px;background:#F3F8F5;border-left:3px solid var(--teal2);border-radius:6px;font-size:13.5px;color:#2F3B37}
  .acc .ex{margin:0 15px 14px;padding:10px 12px;background:#FBF7EE;border-left:3px solid #D9B45A;border-radius:6px;font-size:13.5px;color:#4A3D1C}
  .acc .ctx b,.acc .ex b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
  .acc .ctx b{color:var(--teal)} .acc .ex b{color:#8A6A1E}
  .acc .panel p{margin:0;padding:0 15px 14px;font-size:14px;color:#46524D}
  .acc .src{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-left:8px}

  /* ---------- sub-track toggle ---------- */
  .subs{display:inline-flex;gap:4px;background:#E6ECE8;border-radius:11px;padding:4px;margin:0 0 18px;flex-wrap:wrap}
  .subs button{border:0;background:none;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--slate-d);
    padding:8px 14px;border-radius:8px;cursor:pointer}
  .subs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,33,30,.12)}
  .subs-lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

  /* ---------- learning ---------- */
  .learn-note{font-size:13px;color:var(--muted);margin:0 0 14px}
  .lgrp{margin-bottom:16px}
  .lgrp h4{font-size:13px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .lgrp h4 .ic{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;background:#EEF4F1}
  .litem{display:block;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;margin-bottom:6px;
    text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
  a.litem:hover{border-color:#B9D3CA;background:#F7FBF9}
  .litem .ln{font-weight:700;font-size:14px;color:var(--teal)}
  .litem .lb{font-size:12.5px;color:var(--muted);margin-left:6px}
  .litem .lw{display:block;font-size:13px;color:#46524D;margin-top:2px}
  .litem .lu{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px;letter-spacing:.04em}
  .litem.do{background:#FBF7EE;border-color:#EADFC4}
  .litem.do .ln{color:#7A5A14}
  .africa{background:linear-gradient(180deg,#fff,#F3F8F5);border:1px solid #CFE3DA;border-radius:12px;padding:14px 14px 6px;margin-top:6px}
  .africa h4.ah{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 4px}
  .africa p.as{font-size:13px;color:var(--muted);margin:0 0 12px}

  /* ---------- overview ---------- */
  .ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}
  .ov-card{background:var(--card);border:1px solid var(--hair);border-radius:14px;
    box-shadow:var(--shadow);padding:20px 22px}
  .ov-card h3{margin:0 0 8px;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .ov-card p{margin:0 0 8px;font-size:14px;color:#3A4642}
  .ov-card.span{grid-column:1 / -1}
  .bandtable{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
  .bandtable th,.bandtable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
  .bandtable th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .bandtable td.code{font-family:var(--mono);font-weight:700;color:var(--teal)}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
  .two-tests{counter-reset:t;list-style:none;margin:0;padding:0}
  .two-tests li{position:relative;padding-left:34px;margin-bottom:12px;font-size:14px;color:#3A4642}
  .two-tests li:before{counter-increment:t;content:counter(t);position:absolute;left:0;top:0;
    width:23px;height:23px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;
    font-size:12px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
  .gate{background:linear-gradient(180deg,#fff, #FBF4F3);border:1px dashed #E2B0AB;}

  @media (max-width:860px){
    .app{flex-direction:column}
    .side{width:100%;flex:none;height:auto;position:static;padding:18px 16px}
    .nav{display:flex;flex-wrap:wrap;gap:4px}
    .nav-h{width:100%}
    .nav button{width:auto}
    .side-foot{display:none}
    .main{padding:22px 18px 60px}
    .ov-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">Pesa</span><span class="dot"></span></div>
    <div class="brand-sub">Career GPS &middot; Marketing</div>
    <nav class="nav" id="nav">
      <button class="home active" data-view="overview">&#9678;&nbsp; Start here</button>
      <div class="nav-h">Departments</div>
      <!-- dept buttons injected -->
    </nav>
    <div class="side-foot">
      A map, not a promotion schedule. Bands describe expected impact; growth is the route, not a timetable.
    </div>
  </aside>

  <main class="main" id="main"><!-- view injected --></main>
</div>

<script>
/* ============================ DATA ============================ */

// Generic band scope + experience (shared across departments). {dept} replaced at render.
const BANDS = {
  b1:{code:"B1", scope:"Executes routine, well-defined {dept} work under supervision — a mix of doing and learning the craft, the tools, and how Pesa's corridors work.", exp:"0–2 years, or a strong graduate / career-changer."},
  b2:{code:"B2", scope:"Owns a {dept} channel or area and runs it independently against clear goals.", exp:"Roughly 2–4 years in the discipline or a related field."},
  b3:{code:"B3", scope:"Owns outcomes across a {dept} channel or a whole corridor, with real judgement and initiative. This is the fork band — by the end of it you choose the IC or People track.", exp:"Roughly 4+ years."},
  b4:{code:"B4", scope:"Sets the approach for a {dept} domain and is accountable for its results.", exp:"Roughly 4–6 years."},
  b5:{code:"B5", scope:"Authority for a {dept} craft or sub-function; decisions reach adjacent teams and the wider business.", exp:"Roughly 6+ years (People track: 1+ year managing)."},
  b6:{code:"B6", scope:"Owns a {dept} function, its strategy and multiple teams; part of the broader management group.", exp:"Roughly 8+ years, with 3+ in management."}
};

// Core competencies — descriptions tuned by tier. tiers: foundation,core,advanced,lead,senior,principal
const CORE = [
  ["Craft & Execution",{
    foundation:"Produces clean, on-brief work to spec with guidance; applies the style guide and filing conventions.",
    core:"Owns the day-to-day output of a channel or area; work needs little correction.",
    advanced:"Owns end-to-end output across a channel or corridor and sets the quality bar for it.",
    lead:"Defines the playbook and standards for a domain; owns the hardest work in it.",
    senior:"Defines what 'good' means for the whole discipline; work others model themselves on.",
    principal:"Accountable for the quality of everything the function ships."}],
  ["Communication & Influence",{
    foundation:"Communicates clearly, asks good clarifying questions, and flags issues early.",
    core:"Adapts the message to the audience and makes sound, well-argued recommendations.",
    advanced:"Tailors and defends ideas while keeping relationships; gains commitment from others.",
    lead:"Builds buy-in across disciplines and brings contributors along.",
    senior:"Builds influence strategies that shift senior stakeholders; commands the room.",
    principal:"Sets a culture of open, honest communication across the function."}],
  ["Planning & Project Management",{
    foundation:"Manages own workload to deadlines and follows simple workflows.",
    core:"Plans and prioritises a varied workload; manages small projects.",
    advanced:"Leads multi-part projects with several contributors from start to finish.",
    lead:"Owns the plan for a domain; anticipates risks and dependencies.",
    senior:"Turns strategy into achievable programmes; manages large, complex work.",
    principal:"Aligns plans across teams to longer-term business goals."}],
  ["Problem-Solving & Judgement",{
    foundation:"Solves clearly defined problems and proposes on-brief solutions.",
    core:"Weighs options and recognises when to deviate from standard practice.",
    advanced:"Gets to root causes, spots flaws in data and arguments, and tests new approaches.",
    lead:"Owns ambiguous problems for a domain and chooses well under uncertainty.",
    senior:"Takes a systemic view of long-range problems and reshapes process to fix them for good.",
    principal:"Fosters an owning-outcomes approach to problems across the function."}],
  ["Collaboration & Teamwork",{
    foundation:"Collaborates well, is open to feedback, and brings a positive presence.",
    core:"Actively involves others; requests work from Design, Data and Content clearly and on time.",
    advanced:"Resolves differences to win-win outcomes; mentors juniors.",
    lead:"Builds cross-functional relationships with Sales, Support and Product.",
    senior:"A trusted node in wider decisions across Pesa.",
    principal:"Builds synergy across teams and geographies."}],
  ["Data, Measurement & Storytelling",{
    foundation:"Grasps key metrics and reports with templates and guidance.",
    core:"Tracks core metrics and explains what happened.",
    advanced:"Interprets metrics, explains anomalies, and tests on the data.",
    lead:"Reads a funnel and distinguishes a quick fix from a roadmap item.",
    senior:"Distils complex data into a narrative that wins support and changes direction.",
    principal:"Sets the KPIs and reporting plan for the function."}],
  ["Business & Corridor Acumen",{
    foundation:"Understands the product and who our senders are; basic corridor awareness.",
    core:"Connects daily work to a corridor's goals; aware of compliance limits — consent, regional rules, no overpromising on fees or FX.",
    advanced:"Reads corridor economics and the competitive landscape.",
    lead:"Weighs corridor levers and ROI when setting the approach.",
    senior:"Shapes strategy from market insight; weighs corridor ROI against company priorities.",
    principal:"Sets direction from a deep read of the market and the corridor portfolio."}]
];
const TIER = {b1:"foundation",b2:"core",b3:"advanced",b4:"lead",b5:"senior",b6:"principal"};

// Track add-on skills
const TRACK = {
  ic_lead:[
    ["Technical Depth & Standard-Setting","Recognised inside Pesa as an authority; defines best practice and raises the bar."],
    ["Influence Without Authority","Drives adoption across teams through expertise and credibility, not management."]],
  ic_senior:[
    ["Technical Depth & Standard-Setting","A principal craft authority inside and beyond Pesa; defines best practice org-wide."],
    ["Influence Without Authority","Impact far beyond own projects; lifts the whole team without managing anyone."]],
  people_lead:[
    ["People Leadership & Coaching","Runs a small team day-to-day; assigns and reviews work, coaches, supports development with guidance."],
    ["Finance & Budget","Begins owning a budget line; tracks spend against return."]],
  people_senior:[
    ["People Leadership & Coaching","Owns hiring, performance and development for a sub-function's team; may manage Team Leads."],
    ["Finance & Budget","Owns significant budget; prioritises by ROI and strategy."]],
  people_b6:[
    ["People Leadership & Coaching","Manages managers; builds a diverse, high-performing, motivated function."],
    ["Finance & Budget","Owns the function's budget and champions its priorities with leadership."]]
};

// Node geometry (same for every department)
const NODES = [
  {rung:"b1", band:"b1", track:"shared", x:80,  y:262, lab:["Coordinator"], pos:"above"},
  {rung:"b2", band:"b2", track:"shared", x:240, y:262, lab:["Specialist"], pos:"above"},
  {rung:"b3", band:"b3", track:"shared", x:402, y:262, lab:["Senior","Specialist"], pos:"above"},
  {rung:"b4ic", band:"b4", track:"ic", x:606, y:142, lab:["Manager (IC)"], pos:"above"},
  {rung:"b5ic", band:"b5", track:"ic", x:784, y:142, lab:["Senior Mgr (IC)"], pos:"above"},
  {rung:"b4p", band:"b4", track:"people", x:606, y:382, lab:["Team Lead"], pos:"below"},
  {rung:"b5p", band:"b5", track:"people", x:784, y:382, lab:["Manager"], pos:"below"},
  {rung:"b6p", band:"b6", track:"people", x:946, y:382, lab:["Senior","Manager"], pos:"below"}
];
// map band of a rung -> track-skill key
function trackSkills(rung){
  if(rung==="b4ic")return TRACK.ic_lead;
  if(rung==="b5ic")return TRACK.ic_senior;
  if(rung==="b4p")return TRACK.people_lead;
  if(rung==="b5p")return TRACK.people_senior;
  if(rung==="b6p")return TRACK.people_b6;
  return [];
}

// Departments: craft is keyed by band (b1..b6); titles keyed by rung.
const DEPTS = [
  {id:"social", name:"Social Media, Community & Influencer", tick:"#E0567A",
   blurb:"Pesa's voice, community and creator partnerships across social platforms and the diaspora we serve — organic social, community care, and influencer and ambassador programmes.",
   titles:{b1:"Social Media Coordinator",b2:"Social Media Specialist",b3:"Senior Social Media Specialist",
     b4ic:"Social Media Manager (IC)",b5ic:"Senior Social Media Manager (IC)",
     b4p:"Social Media Team Lead",b5p:"Social Media Manager",b6p:"Senior Manager, Social Media"},
   craft:{
     b1:{s:"Keeps Pesa's social presence running day-to-day under guidance.",r:["Schedule and publish on-brand posts across platforms.","Reply to comments and DMs; flag anything sensitive.","Pull basic engagement reports."],k:[["Publishing & Moderation","Posts on-brand and moderates community to the guidelines."],["Listening","Notices and logs notable comments and trends."]]},
     b2:{s:"Owns a platform or community and runs organic posting and community care for it.",r:["Plan and run the content calendar for a platform or region.","Engage and grow the community; surface sentiment.","Report on reach, engagement and follower growth."],k:[["Community Management","Cares for community in one consistent voice with Support."],["Organic Social","Plans and publishes content that fits each platform."]]},
     b3:{s:"Owns social and community for a corridor or region, across organic and paid social.",r:["Run organic and paid social campaigns end-to-end.","Spot trends and turn them into content opportunities.","Develop creators and ambassadors from the ground up."],k:[["Paid + Organic","Runs both, reads what works, and iterates."],["Creator Programme","Identifies and works with diaspora creators."]]},
     b4:{s:"Sets social strategy and standards for the discipline and owns channel performance.",r:["Define the social playbook and brand voice online.","Build the creator and ambassador programme.","Own social's contribution to corridor growth."],k:[["Social Strategy","Sets where and how Pesa shows up, and why."],["Programme Building","Stands up scalable creator and community programmes."]]},
     b5:{s:"The authority for social and community; sets multi-channel strategy across corridors.",r:["Set the cross-corridor social strategy.","Win support with performance narratives.","Raise the bar across the social team."],k:[["Multi-channel Strategy","Aligns social across corridors and goals."],["Performance Storytelling","Turns social data into decisions."]]},
     b6:{s:"Owns the social and community function, its strategy and teams.",r:["Own social and community strategy and accountability.","Develop the team and its leaders.","Own the function's budget and priorities."],k:[["Function Ownership","Runs social and community as a function."],["Leadership","Builds and grows the team."]]}},
   subs:[
    {id:"social", label:"Social & Community"},
    {id:"influencer", label:"Influencer & Creator Partnerships", name:"Influencer & Creator Partnerships",
     blurb:"Creator, influencer and ambassador partnerships — sourcing, negotiating, running and measuring campaigns that bring diaspora senders to Pesa. A career track inside Social Media & Community.",
     titles:{b1:"Influencer Coordinator",b2:"Influencer Marketing Specialist",b3:"Senior Influencer Marketing Specialist",
       b4ic:"Influencer Marketing Manager (IC)",b5ic:"Senior Influencer Marketing Manager (IC)",
       b4p:"Influencer & Partnerships Team Lead",b5p:"Influencer & Partnerships Manager",b6p:"Senior Manager, Influencer & Creator Partnerships"},
     craft:{
      b1:{s:"Supports creator campaigns day-to-day — sourcing, outreach, briefs and tracking.",r:["Source and vet creators against audience, corridor and brand-safety criteria.","Send briefs, collect drafts, and track deliverables and posting dates.","Log results: reach, clicks, promo-code sign-ups and first sends."],k:[["Creator Sourcing","Finds creators whose audience matches our senders, not just big follower counts."],["Campaign Admin","Keeps trackers, contracts, approvals and payments tidy."]]},

function learnHTML(d,rung){

  let items=[].concat(LEARN[d.id][stage]||[], LEARN_DEPT_ALL[d.id]||[]);
  if(stage==="ic")items=items.concat(LEARN_TRACK.ic);
  if(stage==="people")items=items.concat(LEARN_TRACK.people);
  if(rung==="b6p")items=items.concat(LEARN_TRACK.b6p);
  const card=it=>{
    const [t,n,b,w,u]=it;
    let host="";try{host=new URL(u).hostname.replace(/^www\./,"");}catch(_){}
    const inner='<span class="ln">'+esc(n)+'</span><span class="lb">'+esc(b)+'</span><span class="lw">'+esc(w)+'</span>'+
      (u?'<span class="lu">&#8599; '+esc(host)+'</span>':'');

  };
  const groups=list=>LTYPES.map(([k,label,icon])=>{
    const g=list.filter(x=>x[0]===k); if(!g.length)return "";
    return '<div class="lgrp"><h4><span class="ic">'+icon+'</span>'+label+'</h4>'+g.map(card).join("")+'</div>';
  }).join("");
  const stageNote={found:"Foundation reading for Coordinators and Specialists.",adv:"For Senior Specialists approaching the fork.",

  return '<p class="learn-note">'+stageNote+' Links open a search so you always land on the current edition or version.</p>'+
    groups(items)+

    '<p class="as">Required reading for every role at Pesa — our customers, their corridors, and how money moves home.</p>'+

  [...nav.querySelectorAll("button")].forEach(b=>{

             (state.view==="dept"&&b.dataset.dept===state.dept);

}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function render(){
  if(state.view==="overview"){main.innerHTML=overviewHTML();bindAcc();return;}
  const d0=DEPTS.find(x=>x.id===state.dept);
  const d=effDept(d0);
  main.innerHTML=
    '<div class="topline">Marketing &middot; Department pathway</div>'+
    '<h1 class="dept">'+esc(d0.name)+'</h1>'+
    '<p class="blurb">'+esc(d.blurb)+'</p>'+
    subsHTML(d0)+
    legendHTML()+
    '<div class="mapwrap"><div class="mapinner">'+mapSVG(d)+'</div></div>'+
    '<div id="detail">'+detailHTML(d,state.rung)+'</div>';
  bindMap(d); bindAcc();
  main.querySelectorAll(".subs button").forEach(b=>b.addEventListener("click",()=>{state.sub=b.dataset.sub;render();}));
}
function effDept(d0){
  if(!d0.subs)return d0;
  const sub=d0.subs.find(x=>x.id===state.sub)||d0.subs[0];
  state.sub=sub.id;
  if(sub.id===d0.id)return d0;
  return Object.assign({},d0,{id:sub.id,name:sub.name,blurb:sub.blurb,titles:sub.titles,craft:sub.craft});
}
function subsHTML(d0){
  if(!d0.subs)return "";
  return '<div class="subs-lab">Career track</div><div class="subs">'+
    d0.subs.map(s=>'<button type="button" data-sub="'+s.id+'" class="'+(s.id===state.sub?'on':'')+'">'+esc(s.label)+'</button>').join("")+
    '</div>';
}

function mapSVG(d){

  lines+=line(80,262,402,262,"#0E7D68",3);

  lines+=line(402,262,470,262,"#9AA8A2",3);
  lines+=line(470,142,470,382,"#9AA8A2",3);
  lines+=line(470,142,606,142,"#5B6B78",3);
  lines+=line(470,382,606,382,"#DA5247",3);
  // IC line
  lines+=line(606,142,784,142,"#5B6B78",3);
  // People line
  lines+=line(606,382,946,382,"#DA5247",3);
  // beyond dashed tail
  lines+='<line x1="946" y1="382" x2="1040" y2="382" stroke="#C7CFCB" stroke-width="3" stroke-dasharray="5 6" />';
  // equivalence verticals (faint dotted) at b4 and b5 columns
  lines+='<line x1="606" y1="180" x2="606" y2="344" stroke="#D7DDD9" stroke-width="2" stroke-dasharray="2 6" />';
  lines+='<line x1="784" y1="180" x2="784" y2="344" stroke="#D7DDD9" stroke-width="2" stroke-dasharray="2 6" />';

  let labs='<text class="tracklab" x="503" y="118" text-anchor="middle" fill="#5B6B78">IC path</text>'+
           '<text class="tracklab" x="503" y="414" text-anchor="middle" fill="#DA5247">People path</text>';
  // beyond marker (drawn lock)
  let beyond='<circle cx="1062" cy="382" r="16" fill="#EDEFEC" stroke="#C7CFCB" stroke-width="1.5"/>'+
             '<path d="M1058,381 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#8B968F" stroke-width="2"/>'+
             '<rect x="1056" y="381" width="12" height="9" rx="2" fill="#8B968F"/>'+
             '<text class="beyondlab" x="1062" y="350" text-anchor="middle">Beyond</text>'+
             '<text class="beyondlab" x="1062" y="364" text-anchor="middle">the GPS</text>';
  // nodes
  let nodes="";
  NODES.forEach(n=>{
    const sel=(n.rung===state.rung);
    const fill=TRACKHEX[n.track];
    const labY=n.pos==="above"?(n.y-r-12):(n.y+r+20);

    nodes+='<g class="node" data-rung="'+n.rung+'" role="button" tabindex="0" aria-label="'+esc(d.titles[n.rung])+'">';
    if(sel)nodes+='<circle class="ring" cx="'+n.x+'" cy="'+n.y+'" r="'+(r+6)+'" stroke="'+fill+'"/>';
    nodes+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+fill+'"/>';
    nodes+='<text class="code" x="'+n.x+'" y="'+(n.y+4)+'" text-anchor="middle">'+BANDS[n.band].code+'</text>';
    nodes+='<text class="label" x="'+n.x+'" y="'+labY+'" text-anchor="middle">'+labTxt+'</text>';
    nodes+='</g>';
  });
  return '<svg viewBox="0 0 1120 470" width="100%" role="img" aria-label="'+esc(d.name)+' career pathway">'+
         lines+labs+beyond+nodes+'</svg>';

function line(x1,y1,x2,y2,c,w){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>';}

function bindMap(d){
  main.querySelectorAll(".node").forEach(g=>{
    const pick=()=>{state.rung=g.dataset.rung;
      document.getElementById("detail").innerHTML=detailHTML(d,state.rung);
      // refresh selection ring without full rerender

function detailHTML(d,rung){
  const node=NODES.find(n=>n.rung===rung);
  const band=node.band, tier=TIER[band];
  const craft=d.craft[band];
  const title=d.titles[rung];
  const scope=BANDS[band].scope.replace("{dept}",d.name.split(" (")[0]);
  // skills chips: craft + track + core
  const ts=trackSkills(rung);
  const craftSk=craft.k, coreSk=CORE.map(c=>[c[0],c[1][tier]]);
  const allChips=[].concat(craftSk.map(x=>x[0]),ts.map(x=>x[0]),coreSk.map(x=>x[0]));
  let chips=allChips.map(n=>'<span class="skchip">'+esc(n)+'</span>').join("");
  // detailed accordion: craft, then track, then core
  let acc="";
  const tk=trackKey(rung);
  const craftItems=craftSk.map((x,i)=>[x[0],x[1],(CRAFT_CTX[d.id]&&CRAFT_CTX[d.id][band]||[])[i]||"",""]);
  const trackItems=ts.map((x,i)=>[x[0],x[1],tk?TRACK_CTX[tk][i]:"",""]);
  const coreItems=coreSk.map(x=>[x[0],x[1],CORE_CTX[x[0]].why,CORE_CTX[x[0]].ex[tier]]);

    '<div class="acc"><button type="button">'+esc(it[0])+'<span class="src">'+src+'</span><span class="arw">&#9656;</span></button>'+
    '<div class="panel"><p>'+esc(it[1])+'</p>'+
    (it[2]?'<div class="ctx"><b>At Pesa &middot; in fintech</b>'+esc(it[2])+'</div>':'')+
    (it[3]?'<div class="ex"><b>What it looks like at this band</b>'+esc(it[3])+'</div>':'')+
    '</div></div>';});};
  add(craftItems,"craft");
  if(trackItems.length)add(trackItems,node.track==="ic"?"IC track":"People track");
  add(coreItems,"core");
  // responsibilities
  const own=craft.r.map(x=>'<li>'+esc(x)+'</li>').join("");
  const trackTag='<span class="chip track" style="background:'+TRACKHEX[node.track]+'">'+TRACKNAME[node.track]+'</span>';
  return ''+
  '<div class="detail">'+
    '<div class="d-head">'+
      '<div class="d-meta"><span class="chip band" style="background:'+TRACKHEX[node.track]+'">'+BANDS[band].code+'</span>'+trackTag+

    '</div>'+
    '<div class="d-body">'+
      '<div class="sec"><h3>Job summary</h3><p>'+esc(craft.s)+' '+esc(scope)+'</p></div>'+
      '<div class="sec"><h3>What you own</h3><ul class="own">'+own+'</ul></div>'+
      '<div class="sec"><h3>Experience</h3><p>'+esc(BANDS[band].exp)+'</p></div>'+
      '<div class="sec"><h3>Skills</h3><div class="chips">'+chips+'</div></div>'+
      '<div class="sec"><h3>Detailed skill description</h3>'+acc+'</div>'+
      '<div class="sec"><h3>Recommended learning</h3>'+learnHTML(d,rung)+'</div>'+
    '</div>'+
  '</div>';
}

      '<li><b>Demonstration</b> — a real body of work proving you already operate at the next band: a corridor driven to target, a campaign owned end-to-end, a standard others adopted, or a person you grew.</li></ol></div>'+
    '<div class="ov-card span"><h3>The band map</h3>'+
      '<table class="bandtable"><thead><tr><th>Band</th><th>IC track</th><th>People track</th><th>Scope in one line</th></tr></thead><tbody>'+
      bandRow("B1","Coordinator","—","Executes defined tasks with supervision; learning the craft and the business.")+
      bandRow("B2","Specialist","—","Owns a channel or area and runs it independently against clear goals.")+
      bandRow("B3","Senior Specialist","—","Owns outcomes across a channel or corridor; mentors juniors. Fork point.")+
      bandRow("B4","Manager (IC)","Team Lead","Sets the approach for a domain. IC: deep expert. Lead: runs a small team.")+
      bandRow("B5","Senior Manager (IC)","Manager","Authority for a craft / sub-function. Manager owns a sub-function and its people.")+
      bandRow("B6","—","Senior Manager","Owns a marketing function, its strategy and multiple teams.")+
      '</tbody></table></div>'+
    '<div class="ov-card span gate"><h3>&#128274;&nbsp; Beyond the GPS</h3>'+
      '<p>Director, Head of Corridors, Head of Marketing and VP sit <b>above</b> this map. Reaching Band 6 does not entitle anyone to them — these roles are <b>appointed, not promoted into</b>, based on whether the business needs the seat, C-suite judgement on readiness and team shape, character and leadership, and strategic need in a corridor or function.</p>'+
      '<p style="margin-bottom:0;color:#6E7B76">In short: the GPS guarantees a fair, defined path up to Senior Manager. Beyond it, the path opens only when the business, the seat and the person all line up.</p></div>'+
  '</div>';
}

// Links: open in a new tab; if a viewer blocks pop-ups (file previews, chat apps), open in this tab instead.
document.addEventListener("click",e=>{
  const a=e.target.closest("a.litem"); if(!a)return;
  e.preventDefault();
  let w=null;
  try{w=window.open(a.href,"_blank");if(w)w.opener=null;}catch(_){}
  if(!w){try{window.top.location.href=a.href;}catch(_){window.location.href=a.href;}}
});

syncNav(); render();
</script>
